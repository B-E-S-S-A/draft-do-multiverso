<title>Draft do Multiverso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Banca de jornal em 16 bits: toldo listrado no topo, capas presas no varal com pregador,
   balcão verde da banca no meio, jogador 1 vermelho à esquerda, jogador 2 azul à direita. */
:root {
  --sky: #c4e6f5;
  --sky-dot: #b2dcef;
  --paper: #fffdf6;
  --ink: #1d1b2c;
  --muted: #4f5a6b;
  --banca: #23744f;
  --banca-dk: #17543a;
  --sun: #ffc83d;
  --sun-dk: #d99a12;
  --p1: #db3b2b;
  --p1-dk: #a3251a;
  --p1-tint: #fde3dc;
  --p2: #2b62d9;
  --p2-dk: #1a3f97;
  --p2-tint: #dde7fd;
  --line: #1d1b2c;
  --shadow: 4px 4px 0 var(--ink);
  --display: 'Jersey 10', 'Arial Narrow', Impact, sans-serif;
  --body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  --label: 'Silkscreen', 'Courier New', monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
html { background: var(--sky) }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.35;
  background-color: var(--sky);
  background-image: radial-gradient(var(--sky-dot) 1.5px, transparent 1.6px);
  background-size: 12px 12px;
}
button, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.lbl { font-family: var(--label); font-size: 11px; letter-spacing: .06em; text-transform: uppercase }

/* ---------- toldo ---------- */
.awning { position: relative; background: var(--banca); border-bottom: 4px solid var(--ink) }
.stripes {
  height: 44px;
  background: repeating-linear-gradient(90deg, var(--sun) 0 48px, var(--paper) 48px 96px);
  border-bottom: 4px solid var(--ink);
}
.scallops { height: 16px; background:
  radial-gradient(circle at 24px 0, var(--sun) 15px, transparent 16px) 0 0 / 96px 16px repeat-x,
  radial-gradient(circle at 72px 0, var(--paper) 15px, transparent 16px) 0 0 / 96px 16px repeat-x;
  margin-top: -4px; position: relative; image-rendering: pixelated }
.sign { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px 18px; color: var(--paper) }
.sign h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(44px, 8vw, 84px); line-height: .82; letter-spacing: .01em; text-shadow: 4px 4px 0 var(--ink); text-wrap: balance }
.sign h1 em { font-style: normal; color: var(--sun) }
.sign p { margin: 6px 0 0; font-family: var(--label); font-size: 12px; letter-spacing: .08em; color: #cfe9da }
.sign-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end }
.chip-btn { font-family: var(--label); font-size: 11px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); padding: 6px 10px; box-shadow: 3px 3px 0 var(--ink) }
.chip-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink) }

/* ---------- peças comuns ---------- */
.panel { background: var(--paper); border: 4px solid var(--ink); box-shadow: var(--shadow); padding: 18px }
.panel h2 { margin: 0 0 14px; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1 }
.btn {
  --bg: var(--sun); --bg-dk: var(--sun-dk); --fg: var(--ink);
  background: var(--bg); color: var(--fg); border: 3px solid var(--ink); padding: 8px 14px;
  font-family: var(--body); font-weight: 700; font-size: 17px; line-height: 1.1;
  box-shadow: inset 0 -4px 0 var(--bg-dk), 3px 3px 0 var(--ink);
  clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
}
.btn:hover:not(:disabled) { filter: brightness(1.06) }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: inset 0 -2px 0 var(--bg-dk), 1px 1px 0 var(--ink) }
.btn:disabled { --bg: #e4e1d8; --bg-dk: #c9c5b8; --fg: #8b8778; cursor: not-allowed }
.btn.red { --bg: var(--p1); --bg-dk: var(--p1-dk); --fg: #fff }
.btn.blue { --bg: var(--p2); --bg-dk: var(--p2-dk); --fg: #fff }
.btn.green { --bg: var(--banca); --bg-dk: var(--banca-dk); --fg: #fff }
.btn.paper { --bg: var(--paper); --bg-dk: #ddd8c8 }
.btn.big { font-family: var(--display); font-weight: 400; font-size: 36px; padding: 10px 28px 12px; letter-spacing: .02em }
.btn kbd { font-family: var(--label); font-size: 9px; opacity: .75; margin-left: 4px }

/* capas: cada uma é um recorte 96x144 do atlas, ampliado sem suavizar */
.cv { display: block; width: 100%; aspect-ratio: 2 / 3; image-rendering: pixelated; background: #d6d2c4 }
.card { position: relative; margin: 0; background: var(--paper); border: 3px solid var(--ink) }
.card.hq { padding: 4px; background: #fff }
.card.filme { padding: 6px 4px 4px; background: #15131f }
.card.serie, .card.especial { padding: 8px; background: #8d8a96; border-radius: 0 }
.card.serie .cv, .card.especial .cv { border: 3px solid #2a2833 }
.corner { position: absolute; top: 7px; left: 7px; background: #fff; border: 2px solid var(--ink); font-family: var(--label); font-size: 9px; line-height: 1; padding: 3px 4px 2px; text-align: center }
.corner b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px }
.tag { font-family: var(--label); font-size: 10px; letter-spacing: .05em; padding: 2px 6px 1px; border: 2px solid var(--ink); background: var(--paper); display: inline-block; line-height: 1.3 }
.tag.hq { background: var(--sun) }
.tag.filme { background: #15131f; color: #fff }
.tag.serie, .tag.especial { background: #8d8a96; color: #fff }

/* varal com pregadores */
.wire { position: relative; padding-top: 18px; overflow-x: clip }
.wire::before { content: ''; position: absolute; left: 0; right: 0; top: 12px; height: 3px; background: var(--ink) }
.wire-row { display: flex; gap: 12px; overflow-x: auto; padding: 0 4px 14px; scrollbar-width: thin }
.hang { flex: 0 0 auto; position: relative; transform-origin: 50% -8px; animation: sway 3.2s steps(4) infinite alternate }
.hang:nth-child(2n) { animation-delay: -1.4s }
.hang:nth-child(3n) { animation-duration: 2.6s }
.hang::before { content: ''; position: absolute; z-index: 2; top: -12px; left: 50%; width: 10px; height: 20px; margin-left: -5px;
  background: linear-gradient(90deg, #b5814a 0 4px, #8f5f2f 4px 6px, #b5814a 6px); border: 2px solid var(--ink) }
@keyframes sway { from { transform: rotate(-2deg) } to { transform: rotate(2deg) } }
@media (prefers-reduced-motion: reduce) { .hang { animation: none } }

/* nota de real */
.bill { display: inline-grid; grid-template-columns: auto auto; align-items: end; gap: 0 6px; padding: 6px 12px 5px; border: 3px solid var(--ink);
  background: var(--note); box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); min-width: 120px }
.bill .cur { font-family: var(--label); font-size: 12px; padding-bottom: 6px }
.bill b { font-family: var(--display); font-weight: 400; font-size: 46px; line-height: .8; font-variant-numeric: tabular-nums }
.bill i { grid-column: 1 / -1; font-style: normal; font-family: var(--label); font-size: 8px; letter-spacing: .04em; opacity: .7 }
.n1 { --note: #d9c27a } .n2 { --note: #9fc0dc } .n5 { --note: #c6a9dd } .n10 { --note: #f0a08f }
.n20 { --note: #ffd25c } .n50 { --note: #f0b27a } .n100 { --note: #8fb8ea } .n200 { --note: #c9bfb2 }
</style>

    </div>

      <button class="chip-btn" id="voltar" type="button" hidden>← Jogos</button>
      <button class="chip-btn" id="sound" type="button" aria-pressed="true">Som: ligado</button>
    </div>
  </div>
</header>
